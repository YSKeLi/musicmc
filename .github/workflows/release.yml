name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build configured plugin
        env:
          CONFIGURED_PORTAL_URL: ${{ vars.MUSICMC_PORTAL_URL }}
        run: |
          set -euo pipefail
          PORTAL_URL="$CONFIGURED_PORTAL_URL"
          if [ -z "$PORTAL_URL" ]; then
            OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
            REPOSITORY_NAME=${GITHUB_REPOSITORY#*/}
            PORTAL_URL="https://${OWNER}.github.io/${REPOSITORY_NAME}/"
          fi
          chmod +x mvnw
          ./mvnw --batch-mode clean verify \
            -Dmusicmc.github.repository="$GITHUB_REPOSITORY" \
            -Dmusicmc.portal.url="$PORTAL_URL"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find target -maxdepth 1 -type f -name 'MusicMC-*.jar' -print -quit)
          test -n "$JAR"
          gh release create "$GITHUB_REF_NAME" "$JAR#Spigot plugin" \
            --repo "$GITHUB_REPOSITORY" \
            --title "MusicMC $GITHUB_REF_NAME" \
            --generate-notes
